<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Ambit login branding review</title>
    <link rel="stylesheet" href="/deployment/cognito/ambit.css" />
    <style>
      body {
        margin: 0;
        min-height: 100dvh;
        background: #071321;
        color: #edf4f7;
        font:
          14px/1.5 Arial,
          sans-serif;
      }
      body::before {
        content: "";
        position: fixed;
        top: 8vh;
        right: -25vw;
        width: min(135vw, 1600px);
        aspect-ratio: 1;
        background: url("/brand/account-globe.svg") center / contain no-repeat;
        opacity: 0.18;
        pointer-events: none;
      }
      .page-header {
        position: relative;
        padding: 24px 32px;
      }
      .page-header img {
        width: 140px;
        max-width: 100%;
      }
      .review-note {
        position: relative;
        background: #071321;
        color: #a5c6d2;
        padding: 16px 24px;
        text-align: center;
      }
      .review-note a {
        color: #9cd8de;
      }
      .login-preview {
        position: relative;
        max-width: 400px;
        margin: clamp(24px, 9vh, 100px) auto;
        padding: 28px;
        border-radius: 20px;
        background: #071321;
        color: #edf4f7;
      }
      .banner-customizable {
        text-align: center;
        margin: 0 -24px 28px;
      }
      .login-preview label {
        display: block;
        margin: 16px 0 8px;
      }
      .inputField-customizable {
        box-sizing: border-box;
        padding: 12px;
        border-radius: 4px;
      }
      button {
        cursor: pointer;
        border: 0;
        border-radius: 4px;
      }
      .login-links {
        display: grid;
        gap: 14px;
        text-align: center;
      }
      .login-links a {
        color: #9cd8de;
      }
      .preview-status {
        text-align: center;
        color: #a5c6d2;
      }
      @media (max-width: 480px) {
        .login-preview {
          margin: 24px 16px;
          padding: 24px;
        }
      }
    </style>
  </head>
  <body>
    <aside class="review-note">
      Managed login branding preview · Cognito’s exact layout stays
      provider-managed.<br />No credentials are submitted.
      <a href="/review/accounts.html">Account preview</a> · <a href="/">App</a>
    </aside>
    <header class="page-header">
      <img src="/deployment/cognito/ambit-logo.png" alt="ambit" />
    </header>
    <main class="login-preview">
      <h1>Sign in</h1>
      <p class="textDescription-customizable">
        Sign in with your email and password.
      </p>
      <form
        onsubmit="event.preventDefault(); document.getElementById('preview-status').textContent='Preview only. Nothing was submitted.';"
      >
        <label class="label-customizable" for="email">Email</label
        ><input
          class="inputField-customizable"
          id="email"
          type="email"
          autocomplete="email"
          placeholder="you@example.com"
        /><label class="label-customizable" for="password">Password</label
        ><input
          class="inputField-customizable"
          id="password"
          type="password"
          autocomplete="current-password"
        /><button class="submitButton-customizable" type="submit">
          Sign in
        </button>
      </form>
      <div class="login-links">
        <a href="#" onclick="event.preventDefault()">Forgot your password?</a
        ><span
          >Need an account?
          <a href="#" onclick="event.preventDefault()">Sign up</a></span
        >
      </div>
      <p class="preview-status" id="preview-status" role="status"></p>
    </main>
  </body>
</html>
