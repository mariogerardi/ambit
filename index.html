    <style>
      html,
      body {
        margin: 0;
        background: var(--ui-bg, #101010);
      }
      html[data-theme="ocean"] {
        --ui-bg: #101010;
        --ui-text: #ececec;
        --ui-muted: #bdbdbd;
        --map-ocean: #234d69;
        --map-atmosphere: #a6a6a6;
        --map-border: rgba(25, 47, 57, 0.7);
        --map-land-0: #78cfa0;
        --map-land-1: #efbc62;
        --map-land-2: #70bfce;
        --map-land-3: #e99579;
        --map-land-4: #b59ae1;
        --map-land-5: #bfd574;
      }
      html[data-theme="survey"] {
        --ui-bg: #101010;
        --ui-text: #ececec;
        --ui-muted: #bdbdbd;
        --map-ocean: #242424;
        --map-atmosphere: #bcbcbc;
        --map-border: rgba(225, 225, 225, 0.7);
        --map-land-0: #676767;
        --map-land-1: #858585;
        --map-land-2: #747474;
        --map-land-3: #969696;
        --map-land-4: #5b5b5b;
        --map-land-5: #a6a6a6;
      }
      html[data-theme="dusk"] {
        --ui-bg: #100d18;
        --ui-text: #f2edf9;
        --ui-muted: #c4bad5;
        --map-ocean: #211833;
        --map-atmosphere: #b79ae5;
        --map-border: rgba(25, 16, 39, 0.85);
        --map-land-0: #ae7fea;
        --map-land-1: #48bdc9;
        --map-land-2: #df78bb;
        --map-land-3: #678fe0;
        --map-land-4: #c4a4ec;
        --map-land-5: #dfa76b;
      }
      html[data-theme="paper"] {
        --ui-bg: #08140d;
        --ui-text: #f0eddf;
        --ui-muted: #c2c8b9;
        --map-ocean: #204c68;
        --map-atmosphere: #a5b79b;
        --map-border: rgba(10, 27, 17, 0.8);
        --map-land-0: #72956b;
        --map-land-1: #8da976;
        --map-land-2: #537f65;
        --map-land-3: #a1b68b;
        --map-land-4: #699785;
        --map-land-5: #8b8a60;
      }
      .ambit-loading-screen {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        min-height: 100dvh;
        background: var(--ui-bg, #101010);
        color: var(--ui-text, #eff1df);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        text-align: center;
        opacity: 1;
        transition: opacity 450ms ease-out;
      }
      .ambit-loading-screen.is-leaving {
        opacity: 0;
        pointer-events: none;
      }
      .ambit-loading-globe {
        width: min(38vw, 170px);
        height: auto;
      }
      .ambit-loading-title {
        display: block;
        width: clamp(160px, 40vw, 220px);
        height: auto;
      }
      .ambit-loading-copy {
        color: var(--ui-muted, #b6c9bf);
        font-size: 13px;
        letter-spacing: 0.045em;
      }
      .ambit-loading-dots {
        animation: ambit-loading-fade 1.7s ease-in-out infinite;
      }
      @keyframes ambit-loading-fade {
        50% {
          opacity: 0.35;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .ambit-loading-screen {
          transition-duration: 150ms;
        }
        .ambit-loading-dots {
          animation-duration: 4s;
        }
      }
    </style>
    <script>
      document.documentElement.dataset.theme = "ocean";
      try {
        const saved = JSON.parse(
          localStorage.getItem("ambit.theme.v1") || "null",
        );
        if (
          saved?.version === 1 &&
          ["ocean", "survey", "dusk", "paper"].includes(saved.theme)
        ) {
          document.documentElement.dataset.theme = saved.theme;
        }
      } catch {}
    </script>
