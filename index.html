    <meta charset="UTF-8" />

    <meta name="theme-color" content="#07151b" />
    <style>
      html,
      body {
        margin: 0;
        background: #07151b;
      }
      .ambit-loading-screen {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        min-height: 100vh;
        min-height: 100dvh;
        box-sizing: border-box;
        background: #07151b;
        color: #edf2e8;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        text-align: center;
      }
      .ambit-loading-globe {
        width: min(45vw, 220px);
        height: auto;
        margin-bottom: 8px;
        filter: drop-shadow(0 0 28px #2a697455);
      }
      .ambit-loading-turn {
        transform-origin: 110px 110px;
        animation: ambit-loading-turn 10s linear infinite;
      }
      .ambit-loading-title {
        font-size: clamp(44px, 9vw, 60px);
        font-weight: 700;
        line-height: 1;
        letter-spacing: -0.075em;
      }
      .ambit-loading-copy {
        color: #a9c0b4;
        font-size: 13px;
        letter-spacing: 0.045em;
      }
      .ambit-loading-dots {
        animation: ambit-loading-fade 1.7s ease-in-out infinite;
      }
      @keyframes ambit-loading-turn {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes ambit-loading-fade {
        50% {
          opacity: 0.35;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .ambit-loading-turn {
          animation-duration: 50s;
        }
        .ambit-loading-dots {
          animation-duration: 4s;
        }
      }
    </style>

  <body>
    <div id="root">
      <div class="ambit-loading-screen" role="status" aria-live="polite">
        <svg
          class="ambit-loading-globe"
          viewBox="0 0 220 220"
          aria-hidden="true"
        >
          <defs>
            <clipPath id="ambit-loading-clip">
              <circle cx="110" cy="110" r="90" />
            </clipPath>
          </defs>
          <circle cx="110" cy="110" r="90" fill="#10333c" />
          <g clip-path="url(#ambit-loading-clip)">
            <g class="ambit-loading-turn">
              <g
                fill="none"
                stroke="#7ca99e"
                stroke-opacity=".4"
                stroke-width="1.5"
              >
                <ellipse cx="110" cy="110" rx="39" ry="90" />
                <ellipse cx="110" cy="110" rx="73" ry="90" />
                <path d="M20 78q90 30 180 0M20 142q90-30 180 0M20 110h180" />
              </g>

                />

                />
              </g>
            </g>
          </g>
          <circle
            cx="110"
            cy="110"
            r="90"
            fill="none"
            stroke="#aad3c2"
            stroke-opacity=".85"
            stroke-width="2"
          />
        </svg>
        <strong class="ambit-loading-title">ambit</strong>
        <span class="ambit-loading-copy"
          >Loading your world<span class="ambit-loading-dots">…</span></span
        >
      </div>
