name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Tests and production build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pinned Node runtime
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Check documentation formatting
        run: npm run check:docs
      - name: Check backend security and feedback behavior
        run: python3 scripts/run-python-tests.py
      - name: Run unit, asset, and DOM tests
        if: always()
        run: npm test -- --reporter=default --reporter=junit --outputFile.junit=reports/vitest.xml
      - name: Upload test results to Datadog
        if: always()
        env:
          DATADOG_API_KEY: ${{ secrets.DATADOG_API_KEY }}
          DATADOG_SITE: datadoghq.com
          DD_ENV: ci
        run: |
          if [ -n "$DATADOG_API_KEY" ]; then
            if [ -f reports/python.xml ]; then
              npx --yes @datadog/datadog-ci@5.25.0 junit upload --service ambit-api reports/python.xml
            fi
            if [ -f reports/vitest.xml ]; then
              npx --yes @datadog/datadog-ci@5.25.0 junit upload --service ambit-web reports/vitest.xml
            fi
          fi
      - name: Check portable Journey exporter
        run: npm run test:journey-export
      - name: Type-check and build
        env:
          VITE_DATADOG_APPLICATION_ID: ${{ vars.VITE_DATADOG_APPLICATION_ID }}
          VITE_DATADOG_CLIENT_TOKEN: ${{ vars.VITE_DATADOG_CLIENT_TOKEN }}
          VITE_DATADOG_SITE: datadoghq.com
        run: npm run build
      - name: Upload production RUM source maps
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          DATADOG_API_KEY: ${{ secrets.DATADOG_API_KEY }}
          DATADOG_SITE: datadoghq.com
        run: |
          if [ -n "$DATADOG_API_KEY" ]; then
            npx --yes @datadog/datadog-ci@5.25.0 sourcemaps upload dist --service ambit-web --release-version "$GITHUB_SHA" --minified-path-prefix https://playambit.com
          else
            echo "::notice::Set DATADOG_API_KEY to enable RUM source map uploads."
          fi
      - name: Remove private source maps from the site artifact
        run: find dist -type f -name '*.map' -delete
      - name: Check dependency advisories
        run: npm audit --audit-level=high
      - name: Retain verified production artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: production-site
          path: dist/
          if-no-files-found: error
          retention-days: 90

  deploy:
    name: Deploy production
    needs: validate
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: ambit-production-deployment
      cancel-in-progress: false
    steps:
      - name: Check out deployment tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download verified build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: production-site
          path: dist/
      - name: Obtain short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: ambit-${{ github.run_id }}
      - name: Publish verified artifact
        run: python3 scripts/deploy-production.py --expected-commit "$GITHUB_SHA"
      - name: Mark production deployment in Datadog
        env:
          DATADOG_API_KEY: ${{ secrets.DATADOG_API_KEY }}
          DD_API_KEY: ${{ secrets.DATADOG_API_KEY }}
          DATADOG_SITE: datadoghq.com
          DD_SITE: datadoghq.com
          DD_BETA_COMMANDS_ENABLED: "1"
        run: |
          if [ -n "$DATADOG_API_KEY" ]; then
            npx --yes @datadog/datadog-ci@5.25.0 deployment mark --env production --service ambit-web --revision "$GITHUB_SHA"
            npx --yes @datadog/datadog-ci@5.25.0 deployment mark --env production --service ambit-api --revision "$GITHUB_SHA"
          fi
